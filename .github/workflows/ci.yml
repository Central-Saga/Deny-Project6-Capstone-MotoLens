name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test-and-lint:
    name: Backend Tests & Laravel Pint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: motolens_test
          POSTGRES_PASSWORD: motolens_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d motolens_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, gd, exif, mbstring, xml, bcmath, intl, zip
          coverage: none

      - name: Setup Python 3.11 for YOLOv8 ONNX Inference
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python ONNX Runtime Dependencies
        run: python -m pip install --no-cache-dir onnxruntime opencv-python-headless numpy

      - name: Verify Notebook Is Stripped (< 100 KB & 0 Cell Outputs)
        run: |
          python -c "
          import json, os, sys
          nb_path = 'ML/MotoLens_YOLOv8_Training.ipynb'
          size_kb = os.path.getsize(nb_path) / 1024
          nb = json.load(open(nb_path, encoding='utf-8'))
          outputs = sum(len(c.get('outputs', [])) for c in nb.get('cells', []))
          print(f'Notebook size: {size_kb:.2f} KB, Total outputs: {outputs}')
          if size_kb >= 100 or outputs > 0:
              sys.exit('ERROR: Notebook must be < 100 KB and contain 0 cell outputs!')
          "

      - name: Download Canonical ONNX Model from GitHub Release v1.0.1 & Verify SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: 22ec0d55bdb32939ae8ca5cd4bb1207ab8576f4775f8c5e32359ceb81ab49edd
        run: |
          mkdir -p backend/storage/app/ml
          gh release download v1.0.1 --pattern "model_damage.onnx" --dir backend/storage/app/ml --clobber
          echo "${EXPECTED_SHA256}  backend/storage/app/ml/model_damage.onnx" | sha256sum -c -

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment & Generate Dynamic APP_KEY
        working-directory: backend
        run: |
          mkdir -p storage/app/temp
          cp .env.example .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=motolens_test|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=motolens_ci_secret|' .env
          sed -i 's|^ML_PYTHON_BINARY=.*|ML_PYTHON_BINARY=python3|' .env
          php artisan key:generate --ansi

      - name: Run Laravel Pint Code Style Check
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Run Backend Test Suite (18 Files / 118 Tests)
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: motolens_test
          DB_USERNAME: postgres
          DB_PASSWORD: motolens_ci_secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          ML_PYTHON_BINARY: python3
        run: php artisan test

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Compiler Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Next.js 16 Production Bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  android-tests:
    name: Android Unit Tests & Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android JUnit Test Suite
        working-directory: Android-App
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Android Debug APK
        working-directory: Android-App
        run: ./gradlew assembleDebug --stacktrace
