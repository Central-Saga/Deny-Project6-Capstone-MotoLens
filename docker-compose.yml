services:
  postgres:
    image: postgres:16-alpine
    container_name: motolens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: motolens
    ports:
      - "5433:5432"
    volumes:
      - motolens_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motolens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: motolens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - motolens_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  motolens_pgdata:
  motolens_redisdata:
